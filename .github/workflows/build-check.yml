name: Build check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Rebuild dist and verify it matches the committed bundle
        run: |
          npm run build
          git diff --exit-code dist/

      - name: Syntax-check the bundle
        run: node --check dist/index.js
